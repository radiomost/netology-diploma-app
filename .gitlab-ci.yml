stages:
  - build
  - push

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Building Docker image..."
    - docker build -t app:$IMAGE_TAG .
    - docker tag app:$IMAGE_TAG app:latest
  artifacts:
    paths:
      - .docker
    expire_in: 1 hour

push:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "Authenticating to Yandex Container Registry..."
    # Важно: используем 'iam' как username для аутентификации через IAM-токен
    - echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
  script:
    - echo "Pushing to Yandex Container Registry..."
    - docker tag app:$IMAGE_TAG cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:$IMAGE_TAG
    - docker tag app:$IMAGE_TAG cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:latest
    - docker push cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:$IMAGE_TAG
    - docker push cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    