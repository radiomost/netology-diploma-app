stages:
  - build
  - push

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_COMMIT_SHA

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - echo "Building Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$IMAGE_TAG .
    - docker tag $CI_REGISTRY_IMAGE:$IMAGE_TAG $CI_REGISTRY_IMAGE:latest
  artifacts:
    paths:
      - .docker
    expire_in: 1 hour

push:
  stage: push
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - apk add --no-cache curl jq
    - echo "Authenticating to Vault..."
    - export VAULT_TOKEN=$(curl -s --request POST --data "{\"role_id\":\"$VAULT_ROLE_ID\",\"secret_id\":\"$VAULT_SECRET_ID\"}" $VAULT_ADDR/v1/auth/approle/login | jq -r '.auth.client_token')
    - export YC_TOKEN=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/yc/iam-token | jq -r '.data.data.token')
    - echo "$YC_TOKEN" | docker login --username iam --password-stdin cr.yandex
  script:
    - echo "Pushing to Yandex Container Registry..."
    - docker tag $CI_REGISTRY_IMAGE:$IMAGE_TAG cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:$IMAGE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$IMAGE_TAG cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:latest
    - docker push cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:$IMAGE_TAG
    - docker push cr.yandex/$YCR_REGISTRY_ID/netology-diploma-app:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'